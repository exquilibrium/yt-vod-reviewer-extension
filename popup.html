<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>VOD Notes</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      width: 240px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px 10px;
      margin: 0 0 10px 0;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: #f6f6f6;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #ededed;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 2px;
      font-size: 13px;
    }

    .muted {
      color: #666;
      font-size: 12px;
      line-height: 1.3;
      margin-top: 6px;
    }

    input[type="checkbox"] {
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <h3>VOD Notes</h3>

  <button id="showWindowBtn">Show window</button>

  <div class="row">
    <span>Show Window on Start</span>
    <input id="autoShowChk" type="checkbox" />
  </div>

  <div class="row">
    <span>Pause at End of Timestamp Range</span>
    <input id="autoPauseRangeChk" type="checkbox" />
  </div>

  <div class="muted" id="status"></div>

  <script src="popup.js"></script>
</body>

</html>
